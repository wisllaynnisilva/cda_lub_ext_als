name: cda_lub_ext_als

on:
  schedule:
    - cron: '0 4 * * *'  # Todo dia às 01:00 no Brasil (UTC-3)
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Executar script
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          ALS_USERNAME: ${{ secrets.ALS_USERNAME }}
          ALS_PASSWORD: ${{ secrets.ALS_PASSWORD }}
          ALS_URL: ${{ secrets.ALS_URL }}
        run: |
          python cda_lub_ext_als.py
